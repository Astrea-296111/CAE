name: Synthetic pipeline tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Train and screen a candidate batch
        run: |
          python -m src.cli generate --config configs/smoke.yaml
          python -m src.cli train --model physics --config configs/smoke.yaml --output outputs/ci-model
          python -m src.cli screen --checkpoint outputs/ci-model/best.pt --input data/synthetic/candidates.json --top-k 5 --output outputs/ci-screen
