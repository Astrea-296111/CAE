[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cae-gnn-surrogate"
version = "0.2.0"
description = "Synthetic structural graph surrogate modeling and design screening"
requires-python = ">=3.10"
license = "MIT"
dynamic = ["dependencies"]

[project.scripts]
cae = "src.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
